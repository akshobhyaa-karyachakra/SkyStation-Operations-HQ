name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test tools
        run: python -m pip install --upgrade pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check whitespace errors
        run: git diff --check

      - name: Check portal JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source in ("rebuild-preview.html", "public-wallboard.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
              Path(f"/tmp/{Path(source).stem}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/rebuild-preview.js
          node --check /tmp/public-wallboard.js

      - name: Check public wallboard safety markers
        run: python scripts/validate_public_surface.py

name: Bug report
description: Report a reproducible defect in the portal, wallboard, runtime, or documentation.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface or route
      placeholder: Activity Tracking, Analytics, Public Wallboard, runtime endpoint
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include a URL, screenshot, source record reference, or reproducible steps. Redact secrets and private data.
    validations:
      required: true

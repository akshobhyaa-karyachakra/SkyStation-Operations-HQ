<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SkyStation Operations Intelligence entry point">
  <title>SkyStation Operations Intelligence</title>
  <link rel="icon" href="assets/skystation-operations-intelligence-icon.png">
  <style>
    :root{--bg:#080c10;--panel:#101820cc;--line:#293844;--text:#f4f1ea;--muted:#a7b0b6;--orange:#f05b28;--teal:#65c1ae;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;font-family:"Avenir Next",Avenir,Inter,system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden}.entry{min-height:100vh;position:relative;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#050708}.entry:before{display:none}.entry:after{display:none}.topline{position:absolute;top:26px;left:34px;right:34px;z-index:3;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase}.brand{display:flex;gap:10px;align-items:center;color:var(--text);font:700 12px var(--mono);letter-spacing:.08em}.brand-mark{width:28px;height:28px;border:1px solid var(--orange);display:grid;place-items:center;color:var(--orange);clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%)}.signal{display:flex;align-items:center;gap:8px}.signal i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal)}.stage{position:absolute;left:clamp(36px,8vw,128px);top:32%;transform:none;z-index:2;width:min(500px,calc(100vw - 72px));display:grid;justify-items:start;text-align:left;padding:0}.stage> :not(.hero-scene){position:relative;z-index:2}.stage:before{content:"";position:absolute;z-index:1;inset:-22% -28% -22% -18%;background:radial-gradient(ellipse at center,#071017d8 0%,#0710176e 48%,transparent 76%);filter:blur(18px);pointer-events:none}.hero-scene{position:fixed;inset:-4vh -5vw;z-index:0;width:110vw;height:108vh;overflow:hidden;background:#050708}.hero-scene video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;filter:brightness(.9) saturate(.96) contrast(1.02);transform:scale(1.16);opacity:0;transition:opacity .85s ease}.hero-scene video.is-active{opacity:.78}.scene-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#02030442 0%,#02030408 34%,#02030432 100%),linear-gradient(90deg,#020304d0 0%,#02030488 20%,#02030414 48%,#02030418 100%)}.scene-meta{position:absolute;right:clamp(28px,5vw,84px);bottom:clamp(88px,11vh,112px);display:flex;gap:22px;color:#d7dfdfaa;font:10px var(--mono);letter-spacing:.16em}.scene-meta span+span{color:var(--orange)}.eyebrow{margin:0 0 16px;color:#f07847;font:11px var(--mono);letter-spacing:.22em;text-transform:uppercase;text-shadow:0 2px 16px #000}.stage h1{margin:0;max-width:500px;font:600 clamp(38px,4.6vw,62px)/.96 Raleway,"Avenir Next",sans-serif;letter-spacing:-.04em;text-wrap:balance;text-shadow:0 4px 28px #000,0 1px 0 #fff4}.stage h1 em{font-style:normal;color:#f05b28;text-shadow:0 4px 28px #000}.stage p{max-width:430px;margin:18px 0 0;color:#d1d7d9;font-size:15px;line-height:1.5;text-shadow:0 2px 16px #000}.choices{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:10px;margin-top:24px;width:min(440px,100%)}.choice{position:relative;min-height:64px;padding:16px 18px;text-align:left;text-decoration:none;border:1px solid #65c1ae99;border-radius:8px;background:#071216d9;box-shadow:none;backdrop-filter:none;color:var(--text);transition:.22s transform,.22s border-color,.22s background;cursor:pointer}.choice:before{display:none}.choice:not(.public){border-color:#f05b28;background:#f05b28;color:#fff}.choice:not(.public) span{color:#fff}.choice:not(.public):after{color:#fff}.choice:after{content:"↗";position:absolute;top:15px;right:18px;color:#65c1ae;font:18px var(--mono);transition:.22s transform,.22s color}.choice:hover,.choice:focus-visible{transform:translateX(5px);border-color:#f05b28;background:#0b1a20;outline:none}.choice:not(.public):hover,.choice:not(.public):focus-visible{background:#ff7442;border-color:#ff9a75}.choice:hover:after,.choice:focus-visible:after{transform:translate(3px,-2px)}.choice strong{display:block;font:600 17px Raleway,"Avenir Next",sans-serif}.choice span{display:block;margin-top:6px;color:#b9d0cd;font-size:11px;line-height:1.35}.choice span b{color:var(--orange);font:700 14px var(--mono);margin-left:6px}.choice.public span b{color:var(--teal)}.choice.public:hover,.choice.public:focus-visible{border-color:#65c1ae}.foot{position:absolute;bottom:24px;left:34px;right:34px;z-index:3;display:flex;justify-content:space-between;color:#a1adb1;font:10px var(--mono);letter-spacing:.08em;text-shadow:0 2px 12px #000}.hint{color:#b6c1c4}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes rise-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes signal-pulse{0%,100%{box-shadow:0 0 0 0 #65c1ae55}50%{box-shadow:0 0 0 7px #65c1ae00}}@keyframes accent-breathe{0%,100%{opacity:.55;transform:scaleX(.82)}50%{opacity:1;transform:scaleX(1)}}.topline{animation:rise-in .8s cubic-bezier(.2,.75,.25,1) both}.signal i{animation:signal-pulse 2.6s ease-in-out infinite}.stage .eyebrow,.stage h1,.stage>p:not(.eyebrow),.choices{animation:none}.stage{animation:welcome-in .8s ease-out .1s both}@keyframes welcome-in{from{opacity:0}to{opacity:1}}.choice:before{display:none}.foot{animation:none}@media(max-width:640px){.topline{top:18px;left:18px;right:18px}.topline .signal{display:none}.stage{left:18px;right:18px;top:0;transform:none;width:auto;padding:19vh 0 0;justify-items:center;text-align:center}.stage:before{inset:2% -10% -12%}.stage canvas{height:260px}.stage h1{max-width:100%;font-size:clamp(38px,11vw,56px)}.stage p{font-size:14px}.choices{grid-template-columns:1fr;margin-top:26px}.choice{min-height:78px}.foot{left:18px;right:18px;bottom:16px;font-size:8px}.hint{display:none}}@media(prefers-reduced-motion:reduce){.choice{transition:none}.topline,.stage .eyebrow,.stage h1,.stage>p:not(.eyebrow),.choices,.foot{animation:none}.signal i,.choice:before{animation:none}}
  </style>
</head>
<body>
  <main class="entry">
    <div class="topline"><div class="brand"><span class="brand-mark">SK</span> SKYLARK OPERATIONS INTELLIGENCE</div><div class="signal"><i></i> ENTRY SURFACE · READY</div></div>
    <section class="stage" aria-labelledby="title">
      <div class="hero-scene" aria-label="Ambient Skylark drone scene"><video id="drone-video-a" class="is-active" muted autoplay playsinline preload="auto" poster="assets/patang-hero-master.png" src="assets/patang-cursor-scrub.mp4"></video><video id="drone-video-b" muted playsinline preload="auto" poster="assets/patang-hero-master.png" src="assets/patang-cursor-scrub.mp4"></video><div class="scene-shade" aria-hidden="true"></div></div>
      <p class="eyebrow">Skylark / Operations HQ</p>
      <h1 id="title">See the <em>operation clearly.</em></h1>
      <p>A shared view of the operation. Private tools for the team.</p>
      <div class="choices" role="navigation" aria-label="Portal destinations">
        <a class="choice public" href="public-wallboard.html"><strong>Public Dashboard</strong><span>What the team can see</span></a>
        <a id="manager-entry" class="choice" href="login.html"><strong>Manager Vault</strong><span>For managers and leads</span></a>
      </div>
    </section>
    <div class="foot"><span>U100001 · FIXED-WING OPERATIONS SIGNAL</span></div>
  </main>
  <script>
    (()=>{const videos=[document.querySelector('#drone-video-a'),document.querySelector('#drone-video-b')];const managerEntry=document.querySelector('#manager-entry');let active=0,crossfading=false;function begin(){videos[active].play().catch(()=>{});if(matchMedia('(prefers-reduced-motion: reduce)').matches)videos[active].pause()}function fadeToNext(){if(crossfading)return;crossfading=true;const current=videos[active],next=videos[1-active];next.currentTime=0;next.play().catch(()=>{});next.classList.add('is-active');setTimeout(()=>{current.pause();current.classList.remove('is-active');active=1-active;crossfading=false},850)}videos.forEach(v=>v.addEventListener('timeupdate',()=>{if(v===videos[active]&&v.duration&&v.currentTime>v.duration-.95)fadeToNext()}));videos[0].addEventListener('loadedmetadata',begin,{once:true});if(location.hostname.endsWith('github.io'))managerEntry.href='manager-vault-demo-login.html';})();
  </script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skystation-operations-hq"
version = "0.1.0"
description = "Source-grounded SkyStation operations portal and protected runtime adapters"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
exclude = ["data", "docs"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skylark Operations · Public Command Deck</title>
<link rel="icon" href="assets/favicon.svg?v=2">
<style>
:root{--bg:#071015;--ink:#edf4f1;--muted:#86a0a5;--line:#23434b;--teal:#64d5b8;--orange:#ff642d;--amber:#f2b85f;--blue:#75aee8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,ui-sans-serif,system-ui,sans-serif;--display:Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}button{font:inherit}.deck{height:100vh;display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr 44px;background:radial-gradient(circle at 76% 0,#1e4a5428,transparent 32%),linear-gradient(135deg,#071015,#0a171d)}.rail{grid-row:1/3;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;background:#071217cc}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 34px}.brand img{width:32px;height:32px}.brand strong{display:block;font-size:13px;letter-spacing:.16em;text-transform:uppercase}.brand small{display:block;margin-top:4px;color:var(--muted);font:9px var(--mono);letter-spacing:.05em}.rail-label{color:#526f76;font:700 9px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:0 8px 10px}.screen-nav{display:grid;gap:5px}.screen-nav button{display:grid;grid-template-columns:28px 1fr;align-items:center;text-align:left;border:1px solid transparent;border-radius:4px;background:transparent;color:#8ba3a7;padding:11px 9px;cursor:pointer}.screen-nav button:hover{background:#10262d;color:#fff}.screen-nav button.active{background:#153039;border-color:#35616b;color:#fff}.screen-nav b{font:800 11px var(--mono);color:#587b83}.screen-nav button.active b{color:var(--orange)}.screen-nav span{font-size:11px;font-weight:700}.rail-note{margin-top:auto;border-top:1px solid #1d3941;padding:15px 8px;color:#6f898e;font:9px/1.6 var(--mono)}.rail-note strong{color:var(--teal);font-weight:700}.main{min-width:0;min-height:0;display:grid;grid-template-rows:76px 1fr}.top{display:flex;align-items:center;gap:18px;padding:0 38px;border-bottom:1px solid var(--line)}.top-kicker{color:var(--orange);font:700 10px var(--mono);letter-spacing:.2em;text-transform:uppercase}.top-title{font:700 13px var(--mono);color:#c0d0ce}.top-right{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--muted);font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em}.pulse{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px #64d5b81a}.screen-wrap{position:relative;min-height:0;overflow:hidden}.screen{position:absolute;inset:0;padding:42px 48px;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .42s ease,transform .42s ease,visibility .42s}.screen.active{opacity:1;visibility:visible;transform:none}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;max-width:1380px;margin:0 auto 28px}.intro-index{font:800 74px/.8 var(--display);letter-spacing:-.08em;color:#26454d}.intro-copy{flex:1}.eyebrow{color:var(--orange);font:700 10px var(--mono);letter-spacing:.22em;text-transform:uppercase}.intro h1{margin:8px 0 8px;max-width:760px;font:800 clamp(34px,4.2vw,68px)/.94 var(--display);letter-spacing:-.06em}.intro p{margin:0;color:#a7bab9;max-width:620px;font-size:13px;line-height:1.5}.period{text-align:right;color:var(--muted);font:9px/1.7 var(--mono);white-space:nowrap}.canvas{max-width:1380px;margin:auto;display:grid;grid-template-columns:1.45fr .75fr .75fr;grid-template-rows:1fr 1fr;gap:12px;height:calc(100% - 142px)}.hero,.module{border:1px solid var(--line);background:#0c1b21;position:relative;overflow:hidden}.hero{grid-row:1/3;padding:30px;display:flex;flex-direction:column;border-left:3px solid var(--orange);background:linear-gradient(145deg,#122a32,#09171c)}.hero:after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;right:-140px;bottom:-170px;border:1px solid #2c6067;box-shadow:0 0 0 26px #17333b,0 0 0 27px #2b535a;opacity:.45}.module{padding:19px;display:flex;flex-direction:column;justify-content:space-between}.module:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--teal)}.module.warn:before{background:var(--amber)}.module h2,.hero h2{margin:0;font-size:17px;letter-spacing:-.03em}.label{color:var(--muted);font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em}.big{margin-top:20px;font:800 clamp(54px,7vw,108px)/.82 var(--display);letter-spacing:-.09em}.big.orange{color:var(--orange)}.big.teal{color:var(--teal)}.big.amber{color:var(--amber)}.hero-copy{max-width:440px;margin-top:18px;color:#b0c1bf;font-size:12px;line-height:1.5}.hero-bottom{margin-top:auto;display:flex;gap:8px}.chip{border:1px solid #31545b;padding:8px 10px;color:#9eb8b6;font:9px var(--mono)}.chip strong{color:var(--ink);display:block;font-size:16px;margin-bottom:3px}.module-value{margin-top:auto;font:800 42px/.9 var(--display);letter-spacing:-.07em}.module-value.teal{color:var(--teal)}.module-value.amber{color:var(--amber)}.module-note{margin-top:8px;color:#9ab0b1;font-size:10px;line-height:1.35}.bar{height:6px;background:#1a353d;margin-top:15px}.bar i{display:block;height:100%;background:var(--teal)}.bar.amber i{background:var(--amber)}.flow{display:flex;align-items:center;gap:0;margin-top:26px}.flow-step{flex:1;position:relative;text-align:center}.flow-step:before{content:'';position:absolute;top:14px;left:0;right:0;height:2px;background:#31535b}.flow-step:first-child:before{left:50%}.flow-step:last-child:before{right:50%}.node{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;margin:auto;border-radius:50%;background:#102a31;border:2px solid var(--teal);font:700 10px var(--mono)}.flow-step:nth-child(3) .node{border-color:var(--amber)}.flow-step span{display:block;margin-top:9px;color:#b5c5c3;font-size:9px}.rows{display:grid;gap:9px;margin-top:20px}.row{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;color:#a9bcba;font-size:10px}.row b{text-align:right;color:var(--ink);font:700 10px var(--mono)}.row .bar{grid-column:1/-1;margin-top:-4px}.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:18px}.region{border:1px solid #2b4b53;padding:10px;background:#0b1c22}.region b{font-size:12px}.region span{display:block;margin-top:5px;color:var(--muted);font:9px var(--mono)}.region.warn{border-color:#85522f}.ring{width:128px;height:128px;margin:15px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) 0 84%,#1f3940 84%);position:relative}.ring:after{content:'';position:absolute;inset:17%;border-radius:50%;background:#0c1b21}.ring strong{position:relative;z-index:1;font:800 31px var(--display)}.bottom{grid-column:2;grid-row:2;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;color:#738e93;font:9px var(--mono);letter-spacing:.05em}.controls{display:flex;align-items:center;gap:9px}.controls button{border:0;background:transparent;color:#9eb6b6;font-size:18px;cursor:pointer}.controls button:hover{color:var(--orange)}.progress{width:130px;height:4px;background:#1b363d}.progress i{display:block;width:16.6%;height:100%;background:var(--orange)}
@media(max-width:1050px){.deck{grid-template-columns:190px 1fr}.screen{padding:30px 26px}.intro h1{font-size:42px}.canvas{grid-template-columns:1.3fr .85fr .85fr}.top{padding:0 24px}}
@media(max-width:700px){html,body{overflow:auto}.deck{height:auto;min-height:100vh;display:block}.rail{position:sticky;top:0;z-index:5;padding:13px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 0 12px}.brand img{width:27px;height:27px}.brand strong{font-size:11px}.brand small{font-size:8px}.rail-label,.rail-note{display:none}.screen-nav{display:flex;overflow:auto}.screen-nav button{min-width:112px;padding:8px}.main{display:block}.top{height:52px;padding:0 14px}.top-right{display:none}.screen-wrap{height:calc(100vh - 147px);min-height:620px}.screen{padding:22px 14px}.intro{margin-bottom:18px;gap:10px;align-items:flex-start}.intro-index{font-size:42px}.intro h1{font-size:31px}.intro p{font-size:10px}.period{font-size:7px}.canvas{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;height:calc(100% - 128px);gap:8px}.hero{grid-column:1/-1;grid-row:auto;min-height:300px;padding:18px}.module{min-height:140px;padding:13px}.module h2{font-size:13px}.big{font-size:58px}.module-value{font-size:33px}.bottom{position:fixed;left:0;right:0;bottom:0;height:38px;background:#071015;border-top:1px solid var(--line);padding:0 14px;z-index:4}.bottom>span{font-size:7px}.progress{width:60px}}
</style>
</head>
<body>
<div class="deck">
<aside class="rail"><div class="brand"><img src="assets/favicon.svg?v=2" alt="Skylark"><div><strong>Skylark</strong><small>Public operations deck</small></div></div><div class="rail-label">Six public views</div><nav class="screen-nav" aria-label="Public screens"></nav><div class="rail-note"><strong>PUBLIC PROJECTION</strong><br>Aggregate signals only.<br>Internal records remain protected.</div></aside>
<main class="main"><header class="top"><span class="top-kicker">Operations / public display</span><span class="top-title">A shared view of the operation</span><div class="top-right"><span><i class="pulse"></i> source snapshot</span><span>17 Sep 2026 · 09:35 UTC</span></div></header><div class="screen-wrap" id="screens"></div></main>
<footer class="bottom"><span>SKYLARK · PUBLIC OPERATIONS DECK · AGGREGATES ONLY</span><div class="controls"><button id="prev" aria-label="Previous screen">‹</button><span id="counter">01 / 06</span><button id="next" aria-label="Next screen">›</button><button id="pause" aria-label="Pause display">Ⅱ</button><div class="progress"><i id="progress"></i></div></div></footer>
</div>
<script>
const screens=[
 {name:'Operations pulse',title:'Work is moving across the network.',desc:'Delivery health, operating pressure, and the signals that deserve attention now.',period:'September 2026 · month to date',hero:['84%','Operational health','The operating rhythm is stable. Evidence and review queues stay visible so progress is not mistaken for completion.','orange','Stable with attention visible'],mods:[['Reports','218','customer-ready outputs','teal'],['Attention','11','evidence · review · source','amber'],['Execution rate','61%','92 of 151 tracked flights','']]},
 {name:'Delivery flow',title:'Every handoff has a visible state.',desc:'From mapped scope to a delivered customer output, the chain shows where work is accumulating.',period:'End-to-end workflow · public-safe aggregates',hero:['12','Delivered outputs','The chain is visible from mapped scope through execution, processing, reporting, and delivery.','teal','2 awaiting evidence · 2 awaiting review'],mods:[['Stage health','86%','report → delivery conversion','teal'],['In motion','8','work items between stages',''],['Evidence queue','2','next gate before review','amber']]},
 {name:'Crew presence',title:'People present, teams ready.',desc:'Daily presence from authoritative availability status, shown as safe team aggregates.',period:'17 Sep 2026 · 16 active records',hero:['75%','Presence available','12 available · 4 deployed · 0 WFH · 0 on leave.','teal','All active records classified'],mods:[['Available','12','active records','teal'],['Deployed','4','field operations',''],['Confirmation','0','blank active statuses','amber']]},
 {name:'Geographic operations',title:'Coverage where work is happening.',desc:'A region-level operating footprint with status and pressure visible without exposing site-level internal detail.',period:'6 active regions · public geography',hero:['18','Sites complete','Most regions are operating on track. Two weather-constrained operations remain visible.','teal','6 in progress · 2 weather constrained'],mods:[['North / West','12','sites on track','teal'],['Central / Multi','7','sites needing attention','amber'],['South / East','5','sites active','']]},
 {name:'Reporting outcomes',title:'Delivery becomes visible in the report.',desc:'Submission cadence, delivered outputs, and the queue between evidence and customer-ready work.',period:'September 2026 · month to date',hero:['84%','Submission cadence','Most reporting work is moving through the expected cadence. The remaining queue is bounded and classified.','teal','218 reports submitted'],mods:[['Submitted','218','reports this period','teal'],['T+1 performance','84%','within target',''],['Open queue','17','evidence · review · source','amber']]},
 {name:'Fleet & readiness',title:'Readiness stays separate from deployment.',desc:'Public-safe asset readiness, maintenance attention, and incident visibility.',period:'Current readiness snapshot · no serials',hero:['91%','Ready for demand','Readiness is strong for current planned demand. Maintenance attention remains visible as a separate state.','teal','124 ready · 8 maintenance · 3 incidents'],mods:[['Ready assets','124','current ready state','teal'],['Maintenance','8','outside ready state','amber'],['Open incidents','3','aggregate incident count','']]}
];
const nav=document.querySelector('.screen-nav'),host=document.querySelector('#screens');
function module([h,v,n,c]){return `<article class="module ${c==='amber'?'warn':''}"><span class="label">${h}</span><div class="module-value ${c}">${v}</div><div class="module-note">${n}</div><div class="bar ${c==='amber'?'amber':''}"><i style="width:${c==='teal'?'84':c==='amber'?'42':'61'}%"></i></div></article>`}
screens.forEach((s,i)=>{nav.insertAdjacentHTML('beforeend',`<button data-i="${i}" class="${i===0?'active':''}"><b>0${i+1}</b><span>${s.name}</span></button>`);host.insertAdjacentHTML('beforeend',`<section class="screen ${i===0?'active':''}" data-screen="${i}"><div class="intro"><div class="intro-index">0${i+1}</div><div class="intro-copy"><div class="eyebrow">${s.name}</div><h1>${s.title}</h1><p>${s.desc}</p></div><div class="period">${s.period}<br>Public projection</div></div><div class="canvas"><article class="hero"><span class="label">Primary public signal</span><div class="big ${s.hero[3]}">${s.hero[0]}</div><h2>${s.hero[1]}</h2><p class="hero-copy">${s.hero[2]}</p><div class="hero-bottom"><div class="chip"><strong>${i===0?'24':i===1?'24':i===2?'16':i===3?'6':i===4?'218':'124'}</strong>tracked records</div><div class="chip"><strong>${i===0?'11':i===1?'2':i===2?'0':i===3?'2':i===4?'17':'8'}</strong>attention</div></div></article>${s.mods.map(module).join('')}</div></section>`)})
let current=0,paused=false,timer;const all=[...document.querySelectorAll('.screen')],buttons=[...document.querySelectorAll('.screen-nav button')];
function show(i){current=(i+screens.length)%screens.length;all.forEach((x,n)=>x.classList.toggle('active',n===current));buttons.forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#counter').textContent=`0${current+1} / 06`;document.querySelector('#progress i').style.width=`${((current+1)/6)*100}%`}
function reset(){clearInterval(timer);if(!paused)timer=setInterval(()=>show(current+1),22000)}buttons.forEach(b=>b.addEventListener('click',()=>{show(+b.dataset.i);reset()}));document.querySelector('#prev').onclick=()=>{show(current-1);reset()};document.querySelector('#next').onclick=()=>{show(current+1);reset()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';reset()};show(0);reset();
</script>
</body>
</html>
